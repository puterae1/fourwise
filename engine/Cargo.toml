[package]
name = "connect4_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[[bin]]
name = "gen_book"
path = "../tools/gen_book.rs"

[[bin]]
name = "compare_gamesolver"
path = "../tools/compare_gamesolver.rs"
